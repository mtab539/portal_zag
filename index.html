<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal ZAG - EAM</title>
  <meta name="description" content="Portal de la campaña de los 30 años del programa de Publicidad Digital y Mercadeo de la EAM. La teoría ZAG de Marty Neumeier hecha comunidad: perfiles, sellos, Muro de Quiebre, mentorías, ZAG Room y tienda.">
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  <link rel="apple-touch-icon" href="assets/logos/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/content.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="ZAG — inicio del portal">
        <img
          class="brand-logo"
          src="assets/logos/logozag.svg"
          alt="ZAG — logotipo del portal"
          data-fallback="ZAG">
        <span class="brand-caption">PORTAL · 30 AÑOS</span>
      </a>

      <button
        id="nav-toggle"
        class="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="primary-nav">
        <span class="nav-toggle--open">Menú</span>
        <span class="nav-toggle--close">Cerrar</span>
      </button>

      <ul id="primary-nav" class="primary-nav" aria-label="Navegación principal"></ul>

      <a class="header-unete btn btn--sm" href="#unirme">Únete</a>
    </div>
  </header>

  <main id="main">

    <!-- 1 · HERO -->
    <section class="hero" aria-labelledby="hero-title">
      <img class="hero-art" src="assets/img/fondoherozag.webp" alt="" aria-hidden="true" fetchpriority="high">
      <img class="hero-art hero-art--rot" src="assets/img/manohero.webp" alt="" aria-hidden="true" fetchpriority="high">
      <div class="container">
        <div id="hero-box"></div>
      </div>
      <canvas id="hero-canvas" class="hero-canvas" aria-hidden="true"></canvas>
    </section>

    <!-- 2 · MARQUEE -->
    <div class="marquee" role="presentation">
      <div id="marquee-track" class="marquee-track" aria-hidden="true"></div>
    </div>

    <!-- 3 · CONTEXTO ZIG vs ZAG -->
    <section class="section section--surface" aria-label="Manifiesto ZIG vs ZAG">
      <div class="container">
        <div class="contexto-grid" data-reveal>
          <div class="contexto-media">
            <img class="contexto-img" src="assets/img/zigvszag.svg" alt="Ilustración del concepto ZIG vs. ZAG: todos hacen zig, nosotros hacemos zag." role="img" width="1440" height="810" />
          </div>
        </div>
      </div>
      <div class="contexto-copy" aria-hidden="true"></div>
    </section>

    <!-- 4 · CARRUSEL — FOTOS DEL PRIMER EVENTO -->
    <section id="eventos" class="section" aria-labelledby="carousel-title">
      <div class="container">
        <p id="carousel-kicker" class="kicker"></p>
        <div class="section-head" data-reveal>
          <h2 id="carousel-title" class="section-title"></h2>
          <p id="carousel-sub" class="section-sub"></p>
        </div>
        <div class="film-wrap" data-reveal>
          <div id="film-track" class="film-track" aria-label="Fotos de las activaciones ZAG que van pasando. El movimiento se pausa al pasar el cursor."></div>
        </div>
      </div>
    </section>

    <!-- 5 · MURO DE QUIEBRE -->
    <section id="muro" class="section muro-section" aria-labelledby="muro-title">
      <div class="container">
        <p id="muro-kicker" class="kicker"></p>
        <div class="section-head" data-reveal>
          <h2 id="muro-title" class="section-title"></h2>
          <p id="muro-sub" class="section-sub"></p>
        </div>
        <div class="muro-grid" data-reveal>
          <figure class="muro-media">
            <img src="assets/img/tribuzaggista1.svg" alt="La Tribu Zaggista celebrando el quiebre del zig" width="430" height="430">
          </figure>
          <div class="muro-side">
            <div id="muro-list" class="muro-list"></div>
            <p id="muro-note" class="muro-note"></p>
            <a id="muro-link" class="muro-link"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- 6 · PERFILES ZAG · Settle — el stack se asienta con el scroll -->
    <section id="perfiles" class="section perfiles-settle" aria-labelledby="niv-title">
      <div class="settle-root">
        <div class="settle-track" id="settle-track">
          <section class="settle-stage">
            <div class="settle-headline">
              <p id="niv-kicker" class="kicker"></p>
              <h2 id="niv-title" class="section-title"></h2>
              <p id="niv-sub" class="section-sub"></p>
            </div>

            <header class="settle-chrome settle-chrome--top">
              <img class="settle-seal" src="assets/logos/sellozagnaranja.png" alt="Sello ZAG naranja" width="56" height="56">
              <span class="settle-label">Perfiles</span>
            </header>

            <div class="settle-deck">
              <div id="settle-front" class="settle-card settle-card--front"></div>
              <div id="settle-back"></div>
            </div>
            <div class="settle-sticker-wrap">
              <img id="settle-sticker" class="settle-sticker" src="assets/img/sticker-noapto.png" alt="Sticker no apto — ZAG" width="160" height="160" loading="lazy">
            </div>

            <footer class="settle-chrome settle-chrome--bottom">
              <span class="settle-hint">Click para ver los perfiles</span>
              <span class="settle-meta">05 NIVELES</span>
            </footer>
          </section>
        </div>

        <section class="settle-about">
          <p id="sellos-line" class="settle-about-text"></p>
        </section>
      </div>
    </section>

    <!-- 7 · PANELES — DESCUBRE EL ZAG -->
    <section id="descubre" class="section section--surface" aria-labelledby="acc-title">
      <div class="container">
        <p id="acc-kicker" class="kicker"></p>
        <div class="section-head" data-reveal>
          <h2 id="acc-title" class="section-title"></h2>
        </div>
        <div id="panel-grid" class="zpanel-grid" data-reveal></div>
      </div>
    </section>

    <!-- ÚNETE — salida explícita para quien no tiene tira (corrección H2) -->
    <section id="unirme" class="section" aria-label="Únete al ZAG">
      <div class="container">
        <p id="unirme-kicker" class="kicker"></p>
        <div class="unirme-layout" data-reveal>
          <div class="unirme-side">
            <img id="unirme-image" class="unirme-image" src="" alt="Únete al ZAG" loading="lazy">
          </div>
          <div id="unirme-grid" class="unirme-grid"></div>
        </div>
      </div>
    </section>

    <!-- 8 · FRASE FINAL -->
    <section class="close-block" aria-labelledby="close-cta">
      <div class="container" data-reveal>
        <div class="close-landing-wrap">
          <img class="close-landing" src="assets/img/fraselanding.svg" alt="30 años rompiendo lo obvio">
          <img class="close-icons" src="assets/img/iconosfrase.svg" alt="" aria-hidden="true">
        </div>
        <a id="close-cta" class="btn btn--hero"></a>
      </div>
    </section>
  </main>

  <!-- 9 · FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-row">
        <div class="footer-social">
          <span class="footer-social-label">Redes Sociales:</span>
          <div id="footer-social" class="social-pill" aria-label="Redes sociales del ZAG"></div>
        </div>
        <div class="footer-legal-group">
          <p id="footer-copyright" class="footer-copyright"></p>
          <p class="footer-legal"><a href="index.html">Términos</a></p>
          <p class="footer-legal"><a href="index.html">COPPA</a></p>
          <p class="footer-legal"><a href="index.html">Privacidad</a></p>
        </div>
      </div>
    </div>
    <a class="footer-logo" href="index.html" aria-label="ZAG — inicio del portal">
      <img src="assets/img/patronzag3.svg" alt="Patrón Cultura Zaggista" data-fallback="ZAG">
    </a>
  </footer>

  <noscript>
    <p style="padding: 24px; font-family: system-ui; text-align: center;">
      El Portal ZAG necesita JavaScript para mostrar su contenido. Volvé a activarlo
      o escribinos a la EAM y te contamos cómo unirte al ZAG.
    </p>
  </noscript>
</body>
</html>
