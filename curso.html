<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curso - Portal ZAG</title>
  <meta name="description" content="Cursos extraclase del Portal ZAG: lecciones, quizzes y certificado de finalización.">
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  <link rel="apple-touch-icon" href="assets/logos/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css?v=30">
  <link rel="stylesheet" href="css/styles.css?v=15">
  <!-- El composer reutiliza el contrato visual muro-cc* del Muro. -->
  <link rel="stylesheet" href="css/muro.css">
  <link rel="stylesheet" href="css/cursos.css?v=3">
  <script src="js/content.js?v=38" defer></script>
  <script src="js/main.js?v=35" defer></script>
  <script src="js/perfil-links.js?v=2" defer></script>
  <script src="js/zag-session.js" defer></script>
  <script src="js/zag-reserva.js?v=1" defer></script>
  <script src="js/cursos-data.js?v=3" defer></script>
  <script src="js/cursos-progreso.js?v=3" defer></script>
  <script src="js/curso.js?v=3" defer></script>
</head>
<body class="curso-page">
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="ZAG — inicio del portal">
        <img
          class="brand-logo"
          src="assets/logos/eamzag.svg?v=3"
          alt="ZAG — logotipo del portal"
          data-fallback="ZAG">
      </a>

      <button
        id="nav-toggle"
        class="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="primary-nav">
        <span class="nav-toggle--open">Menú</span>
        <span class="nav-toggle--close">Cerrar</span>
      </button>

      <ul id="primary-nav" class="primary-nav" aria-label="Navegación principal"></ul>

      <div class="header-right">
        <div id="curso-session-chip" class="cursos-tag cursos-tag--nivel" hidden></div>
        <a class="header-unete btn btn--sm" href="registro.html">Únete</a>
      </div>
    </div>
  </header>

  <!-- Barra de progreso pegajosa -->
  <div class="curso-topbar">
    <div class="container curso-topbar__inner">
      <a id="curso-back" class="curso-topbar__back" href="cursos.html">← Cursos</a>
      <span id="curso-topbar-title" class="curso-topbar__title"></span>
      <span id="curso-topbar-pct" class="curso-topbar__pct"></span>
    </div>
    <div class="curso-topbar__bar">
      <div id="curso-topbar-fill" class="cursos-bar__fill"></div>
    </div>
  </div>

  <main id="main">
    <div class="container curso-layout">

      <!-- ============ COLUMNA PRINCIPAL ============ -->
      <div class="curso-main">

        <!-- Aviso de acceso / bloqueo -->
        <div id="curso-gate" class="curso-locked" hidden>
          <span class="curso-locked__icon" aria-hidden="true">🔒</span>
          <h1 id="curso-gate-title" class="curso-locked__title"></h1>
          <p id="curso-gate-copy" class="curso-locked__copy"></p>
          <div id="curso-gate-actions" class="curso-locked__actions"></div>
        </div>

        <!-- Player -->
        <div id="curso-player" hidden>
          <h1 id="curso-leccion-title" class="cursos-sr"></h1>

          <div class="player">
            <div class="player__frame">
              <!-- El iframe se inyecta solo cuando la lección trae videoUrl. -->
              <div id="player-mount"></div>
            </div>

            <div class="player__caption">
              <p id="player-kicker" class="player__kicker"></p>
              <div class="player__meta">
                <span id="player-dur" class="player__dur"></span>
                <span id="player-nivel" class="cursos-tag cursos-tag--nivel"></span>
              </div>
            </div>
          </div>

          <!-- Marcar completada + navegación -->
          <div id="lesson-done" class="lesson-done">
            <span id="lesson-done-state" class="lesson-done__state"></span>
            <div class="lesson-done__nav">
              <button id="lesson-prev" class="btn btn--sm btn--outline" type="button">← Anterior</button>
              <button id="lesson-done-btn" class="btn btn--sm" type="button">✓ Marcar como completada</button>
              <button id="lesson-next" class="btn btn--sm" type="button">Siguiente lección →</button>
            </div>
          </div>

          <!-- Tabs -->
          <div class="curso-tabs" role="tablist" aria-label="Contenido de la lección">
            <button
              id="tab-desc"
              class="curso-tab"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="panel-desc">Descripción</button>
            <button
              id="tab-mat"
              class="curso-tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="panel-mat">Materiales</button>
            <button
              id="tab-com"
              class="curso-tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="panel-com">Comentarios</button>
          </div>

          <section id="panel-desc" class="curso-panel" role="tabpanel" aria-labelledby="tab-desc"></section>
          <section id="panel-mat" class="curso-panel" role="tabpanel" aria-labelledby="tab-mat" hidden></section>
          <section id="panel-com" class="curso-panel" role="tabpanel" aria-labelledby="tab-com" hidden></section>

          <!-- Quiz del módulo (aparece al llegar a la última lección) -->
          <div id="quiz-host" class="quiz" hidden></div>

          <!-- Tarjeta del profesor -->
          <div id="profe-host"></div>
        </div>
      </div>

      <!-- ============ SIDEBAR DE MÓDULOS ============ -->
      <aside class="sidebar" aria-labelledby="side-title">
        <div class="side-panel">
          <div class="side-panel__head">
            <h2 id="side-title" class="side-panel__title">Contenido del curso</h2>
            <span id="side-pct" class="side-panel__pct"></span>
          </div>
          <div id="side-mods" class="side-panel__body"></div>
        </div>

        <!-- Panel del certificado -->
        <div id="cert-box" class="side-panel cert-box"></div>
      </aside>
    </div>
  </main>

  <!-- Botón fijo de móvil -->
  <button id="next-fab" class="btn next-fab" type="button">Siguiente lección →</button>

  <!-- Región viva -->
  <p id="curso-vivo" class="cursos-sr" role="status" aria-live="polite"></p>

  <!-- Modal: certificado listo / Sello ZAG ganado -->
  <div
    id="curso-modal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="curso-modal-title"
    hidden>
    <div class="modal__box">
      <button id="curso-modal-close" class="modal__close" type="button" aria-label="Cerrar">✕</button>
      <p id="curso-modal-icon" class="modal__icon" aria-hidden="true"></p>
      <h2 id="curso-modal-title" class="modal__title"></h2>
      <p id="curso-modal-copy" class="modal__copy"></p>
      <div id="curso-modal-actions" class="modal__actions"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-main">
        <div class="footer-col footer-col--brand">
          <a class="footer-eam" id="footer-eam-link">
            <img class="footer-eam-img" id="footer-eam-img" alt="">
          </a>
          <div class="footer-social">
            <span class="footer-social-label">Redes Sociales:</span>
            <div id="footer-social" class="social-pill" aria-label="Redes sociales del ZAG"></div>
          </div>
        </div>
        <div class="footer-col footer-col--contact">
          <address id="footer-contacto" class="footer-contacto"></address>
        </div>
      </div>
      <div class="footer-legal-bar">
        <p id="footer-copyright" class="footer-copyright"></p>
        <nav class="footer-legal-links" aria-label="Enlaces legales">
          <a href="index.html">Política de privacidad</a>
          <a href="index.html">Tratamiento de Datos Personales</a>
          <a href="https://eam.edu.co/servidor_media/pdfs/normatividad/7.1TRATAMIENTO%20DE%20DATOS.pdf" target="_blank" rel="noopener noreferrer">Términos y Condiciones</a>
          <button id="curso-reset" class="mentorias-reset" type="button"></button>
        </nav>
      </div>
    </div><a class="footer-logo" href="index.html" aria-label="ZAG — inicio del portal">
      <img src="assets/img/patronzag3.svg" alt="Patrón Cultura Zaggista" data-fallback="ZAG">
    </a>
  </footer>

</body>
</html>
